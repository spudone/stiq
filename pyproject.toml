[project]
name = "stiq"
version = "0.1.0"
description = "Stock Ticker"
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
    "aiohttp>=3.13.5",
    "fastapi>=0.136.3",
    "holidays>=0.97",
    "pyinstaller>=6.20.0",
    "pytz>=2026.2",
    "setuptools>=82.0.1",
    "sse-starlette>=3.4.4",
    "tiingo>=0.16.1",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
yfinance = [
    "yfinance>=1.3.0",
]
tiingo-ws = [
    "websockets>=16.0",
]


[project.scripts]
stiq = "stiq.main:main"

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
