[project]
name = "stiq"
version = "0.1.0"
description = "Stock Ticker"
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
    "pyinstaller>=6.20.0",
    "pytz>=2026.2",
    "setuptools>=82.0.1",
]

[project.optional-dependencies]
yfinance = [
    "yfinance>=1.3.0",
]
tiingo-ws = [
    "websockets>=16.0",
]


[project.scripts]
stiq = "stiq.main:main"

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
