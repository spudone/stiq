[project]
name = "stiq"
version = "0.1.0"
description = "Stock Ticker"
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
    "aiohttp>=3.14.1",
    "fastapi>=0.139.0",
    "holidays>=0.100",
    "pyinstaller>=6.21.0",
    "pytz>=2026.2",
    "setuptools>=83.0.0",
    "sse-starlette>=3.4.5",
    "tiingo>=0.16.1",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
yfinance = [
    "yfinance>=1.5.1",
]
tiingo-ws = [
    "websockets>=16.1",
]


[project.scripts]
stiq = "stiq.main:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
