[project]
name = "stiq"
version = "0.1.0"
description = "Stock Ticker"
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.141.1",
    "holidays>=0.102",
    "pyinstaller>=6.22.0",
    "pytz>=2026.3.post1",
    "setuptools>=83.0.0",
    "sse-starlette>=3.4.8",
    "tiingo>=0.16.1",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
yfinance = [
    "yfinance>=1.6.0",
]
tiingo-ws = [
    "websockets>=17.0.1",
]


[project.scripts]
stiq = "stiq.main:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (formatter handles formatting)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.Body",
    "fastapi.params.Body",
    "fastapi.Header",
    "fastapi.params.Header",
    "fastapi.Path",
    "fastapi.params.Path",
]

