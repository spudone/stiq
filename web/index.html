<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Stiq — a high-density browser-based stock ticker for tracking markets and individual equities." />
  <title>Stiq — Stock Ticker</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- Compiled Tailwind CSS -->
  <link rel="stylesheet" href="style.css?v=4" />

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- ApexCharts -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@4/dist/apexcharts.min.js"></script>

</head>

<body class="bg-surface-900 text-text-primary font-mono min-h-screen antialiased" x-data="stiq()" x-init="init()">

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- HEADER -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <header class="border-b border-border px-4 py-2 flex items-center justify-between">
    <h1 class="text-accent-cyan font-sans font-bold text-lg tracking-wide">STIQ</h1>
    <div class="flex items-center gap-4 text-xs text-text-muted">
      <span x-text="currentDate"></span>
      <span class="inline-block w-2 h-2 rounded-full" :class="marketOpen ? 'bg-gain animate-pulse' : 'bg-loss'"></span>
      <span x-text="marketOpen ? 'Market Open' : 'Market Closed'" class="uppercase tracking-widest text-[10px]"></span>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════ -->
    <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MARKET OVERVIEW BAR -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <section id="market-bar" class="bg-surface-800 border-b border-border px-4 py-1.5" x-show="marketProvider !== 'tiingo'">
    <!-- Row 1: Dow, S&P 500, NASDAQ -->
    <div x-show="marketData.length > 0" class="flex flex-wrap gap-x-4 gap-y-1 text-xs mb-1">
      <template x-for="item in marketData.slice(0, 3)" :key="item.name">
        <div class="flex items-center gap-1 whitespace-nowrap">
          <span class="text-text-muted font-medium w-24" x-text="item.name"></span>
          <span class="font-mono tabular-nums text-text-primary font-medium w-24" x-text="fmt.number(item.value)"></span>
          <span class="font-mono tabular-nums text-[11px]" :class="item.change >= 0 ? 'text-gain' : 'text-loss'"
            x-text="(item.change >= 0 ? '▲' : '▼') + ' ' + fmt.change(item.change) + '%'"></span>
        </div>
      </template>
    </div>

    <!-- Row 2: Tokyo, HK, London, Frankfurt -->
    <div x-show="marketData.length > 3" class="flex flex-wrap gap-x-4 gap-y-1 text-xs mb-1">
      <template x-for="item in marketData.slice(3, 7)" :key="item.name">
        <div class="flex items-center gap-1 whitespace-nowrap">
          <span class="text-text-muted font-medium w-24" x-text="item.name"></span>
          <span class="font-mono tabular-nums text-text-primary font-medium w-24" x-text="fmt.number(item.value)"></span>
          <span class="font-mono tabular-nums text-[11px]" :class="item.change >= 0 ? 'text-gain' : 'text-loss'"
            x-text="(item.change >= 0 ? '▲' : '▼') + ' ' + fmt.change(item.change) + '%'"></span>
        </div>
      </template>
    </div>

    <!-- Row 3: 10-Year Yield, Euro, Yen, Oil, Gold -->
    <div x-show="marketData.length > 7" class="flex flex-wrap gap-x-4 gap-y-1 text-xs">
      <template x-for="item in marketData.slice(7)" :key="item.name">
        <div class="flex items-center gap-1 whitespace-nowrap">
          <span class="text-text-muted font-medium w-24" x-text="item.name"></span>
          <span class="font-mono tabular-nums text-text-primary font-medium w-24" x-text="fmt.number(item.value)"></span>
          <span class="font-mono tabular-nums text-[11px]" :class="item.change >= 0 ? 'text-gain' : 'text-loss'"
            x-text="(item.change >= 0 ? '▲' : '▼') + ' ' + fmt.change(item.change) + '%'"></span>
        </div>
      </template>
    </div>

    <p x-show="marketData.length === 0" class="text-text-muted text-xs italic">Loading market data…</p>
  </section>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- QUOTES-ONLY HEADER (Tiingo) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <section id="quotes-only-bar" class="bg-surface-800 border-b border-border px-4 py-2" x-show="marketProvider === 'tiingo'" style="display: none;">
    <div class="flex items-center text-xs">
      <span class="text-accent-cyan font-medium mr-2">Quotes-Only Mode:</span>
      <span class="text-text-primary">Real-time Equities & ETFs via Tiingo IEX WebSocket</span>
    </div>
  </section>



  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- WATCHLIST -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <main class="px-4 py-3">
    <!-- Add Quote -->
    <div class="flex items-center gap-2 mb-3">
      <input id="quote-input" type="text" placeholder="Add quote (e.g. AAPL)"
        class="bg-surface-700 border border-border text-text-primary text-xs font-mono px-3 py-1.5 rounded focus:outline-none focus:ring-1 focus:ring-accent-blue placeholder:text-text-muted w-48"
        x-model="newQuote" @keydown.enter="addQuote()" />
      <button id="add-quote-btn"
        class="bg-accent-blue/20 text-accent-blue text-xs font-sans font-medium px-3 py-1.5 rounded hover:bg-accent-blue/30 transition-colors"
        @click="addQuote()">+ Add</button>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full text-xs" id="quotes-table">
        <thead>
          <tr class="text-text-muted uppercase tracking-wider text-[10px] border-b border-border">
            <th class="text-left py-2 pr-4 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('quote')">
              Quote<span x-show="sortKey === 'quote'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('last')">
              Last<span x-show="sortKey === 'last'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('change')">
              Change<span x-show="sortKey === 'change'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('changePct')">
              Change%<span x-show="sortKey === 'changePct'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('open')">
              Open<span x-show="sortKey === 'open'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('low')">
              Low<span x-show="sortKey === 'low'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('high')">
              High<span x-show="sortKey === 'high'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('low52')">
              52w Low<span x-show="sortKey === 'low52'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('high52')">
              52w High<span x-show="sortKey === 'high52'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('volume')">
              Volume<span x-show="sortKey === 'volume'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('avgVolume')">
              Avg Vol<span x-show="sortKey === 'avgVolume'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('peRatio')">
              P/E<span x-show="sortKey === 'peRatio'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('dividend')">
              Div<span x-show="sortKey === 'dividend'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('yield')">
              Yield<span x-show="sortKey === 'yield'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-right py-2 px-2 font-medium cursor-pointer select-none hover:text-text-primary transition-colors" @click="sortBy('marketCap')">
              Mkt Cap<span x-show="sortKey === 'marketCap'" x-text="sortAsc ? ' ▲' : ' ▼'" class="text-[8px] font-sans"></span>
            </th>
            <th class="text-center py-2 px-2 font-medium w-28">30d</th>
            <th class="text-center py-2 px-2 font-medium w-8"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(q, idx) in getSortedQuoteData()" :key="q.quote">
            <tr class="border-b border-border/50 hover:bg-surface-700/50 transition-colors"
              :class="idx % 2 === 0 ? 'bg-surface-800/30' : ''">
              <td class="py-1.5 pr-4 font-semibold text-accent-cyan" x-text="q.quote"></td>
              <td class="py-1.5 px-2 text-right tabular-nums" x-text="fmt.price(q.last)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums font-medium"
                :class="q.change >= 0 ? 'text-gain' : 'text-loss'" x-text="fmt.change(q.change)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums font-medium"
                :class="q.changePct >= 0 ? 'text-gain' : 'text-loss'" x-text="fmt.change(q.changePct) + '%'"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.price(q.open)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.price(q.low)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.price(q.high)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.price(q.low52)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.price(q.high52)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.volume(q.volume)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.volume(q.avgVolume)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.number(q.peRatio)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.price(q.dividend)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.yieldPct(q.yield)"></td>
              <td class="py-1.5 px-2 text-right tabular-nums text-text-secondary" x-text="fmt.largeVal(q.marketCap)"></td>
              <td class="py-1.5 px-2">
                <div :id="'spark-' + q.quote" class="h-6 w-28"></div>
              </td>
              <td class="py-1.5 px-2 text-center">
                <button class="text-text-muted hover:text-loss transition-colors text-sm" @click="removeQuote(q.quote)"
                  title="Remove">✕</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <p x-show="quotes.length === 0" class="text-text-muted text-xs italic mt-4">
      No quotes in your watchlist. Add one above to get started.
    </p>
  </main>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- FOOTER -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <footer
    class="fixed bottom-0 inset-x-0 border-t border-border bg-surface-900/90 backdrop-blur px-4 py-1.5 text-[10px] text-text-muted flex justify-between">
    <div class="flex items-center gap-2">
      <span x-text="'Refreshed ' + lastUpdated"></span>
      <span class="text-border">|</span>
      
      <template x-if="!marketOpen">
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-surface-600"></span>
          <span class="font-semibold text-text-muted">Quotes: Offline</span>
        </div>
      </template>

      <template x-if="marketOpen && provider === 'tiingo'">
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-gain animate-pulse"></span>
          <span class="text-gain font-semibold">Quotes: Live</span>
        </div>
      </template>

      <template x-if="marketOpen && provider !== 'tiingo'">
        <div class="flex items-center gap-1">
          <span>Quotes:</span>
          <select 
            class="bg-transparent border-none text-[10px] text-text-primary focus:ring-0 cursor-pointer p-0" 
            x-model="pollInterval" 
            @change="setPollInterval($event.target.value)"
          >
            <option value="60" class="bg-surface-800 text-text-primary">1m</option>
            <option value="300" class="bg-surface-800 text-text-primary">5m</option>
            <option value="600" class="bg-surface-800 text-text-primary">10m</option>
            <option value="1800" class="bg-surface-800 text-text-primary">30m</option>
          </select>
        </div>
      </template>
    </div>
  </footer>

  <script src="script.js?v=4"></script>
</body>

</html>
